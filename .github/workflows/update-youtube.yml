
name: Update YouTube Statistics

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch_youtube.py'
      - '.github/workflows/**'

  schedule:
    - cron: '7 * * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-statistics
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch YouTube statistics
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_youtube.py

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json channels.json
          git diff --cached --quiet && exit 0
          git commit -m "Update YouTube statistics"
          git push
