name: Big Brain Brotherhood History
on:
  workflow_dispatch:
  schedule:
    - cron: '45 23 * * *'
permissions:
  contents: write
concurrency:
  group: bbb-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/update_history.py
      - name: Commit snapshot and palette
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history.json channel_colors.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Brotherhood historical statistics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
