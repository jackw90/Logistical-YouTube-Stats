name: Anonymous Creator Timer
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch anonymous timestamp
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MISSING_CREATOR_CHANNEL_ID: ${{ secrets.MISSING_CREATOR_CHANNEL_ID }}
        run: python scripts/update_missing_creator.py
      - name: Commit anonymous timestamp
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missing_creator.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update anonymous upload timer'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
